services:
  - type: web
    name: masksafe-backend
    runtime: python
    runtimeVersion: 3.11
    rootDir: backend
    plan: free
    # tesseract é exigido pelo OCR (pytesseract) para páginas PDF sem camada
    # de texto. Sem ele, upload de PDF só-imagem falhava com 500.
    aptPackages:
      - tesseract-ocr
      - tesseract-ocr-por
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Connection string do Neon: o Render pede o valor na criação do Blueprint.
      - key: DATABASE_URL
        sync: false
      # O Render gera uma chave aleatória forte automaticamente.
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://masksafe.vercel.app
      - key: FRONTEND_ORIGINS
        value: https://masksafe.vercel.app
